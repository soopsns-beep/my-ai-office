<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY AI OFFICE</title>
<style>
  :root{--bg:#0f2c35;--bar:#0b222a;--pill:#16404a;--txt:#eafffa;--muted:#8fc7bd;--green:#7fd9c3;--pink:#7fd9c3}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--bar);border-bottom:1px solid #1d4d57;flex-wrap:wrap}
  .logo{font-family:monospace;letter-spacing:3px;font-size:14px;color:var(--muted)}
  .logo b{color:#fff}
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  .pill{background:var(--pill);border:1px solid #2b6370;color:var(--txt);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
  .pill.on{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
  .pill .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  main{flex:1;display:flex;flex-direction:column;align-items:center;padding:16px}
  .stage{position:relative;width:100%;max-width:1100px}
  canvas{width:100%;height:auto;display:block;border-radius:16px;background:#12182a;image-rendering:pixelated;cursor:pointer}
  .hint{color:var(--muted);font-size:12px;text-align:center;margin:10px 0 0}
  .card{position:absolute;background:#0d2a31f2;border:1px solid #4fb7a2;border-radius:14px;padding:14px 16px;width:260px;box-shadow:0 10px 30px #0008;font-size:14px}
  .card h3{margin:0 0 4px;font-size:17px}
  .card .role{color:var(--pink);font-size:13px;margin-bottom:8px}
  .card p{margin:6px 0;line-height:1.5;color:#d5f3ec}
  .card button{margin-top:8px;margin-right:6px}
  .hidden{display:none}
  #agentList{right:12px;top:12px;max-height:80%;overflow:auto}
  #agentList .row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #1d4d57;cursor:pointer}
  #agentList .row:hover{color:var(--pink)}
  #log{width:100%;max-width:1100px;margin-top:10px;max-height:150px;overflow:auto;font-size:13px;color:#d5f3ec;background:#123842;border-radius:12px;padding:8px 12px}
  #log:empty{display:none}
  #log div{padding:2px 0}
  #log .who{color:var(--pink);font-weight:600}
  footer{display:flex;gap:8px;align-items:center;padding:12px 16px;background:var(--bar);border-top:1px solid #1d4d57}
  #target{font-size:12px;color:var(--muted);white-space:nowrap}
  #msg{flex:1;min-width:0;background:#0c2329;border:1px solid #2b6370;color:#fff;border-radius:999px;padding:11px 16px;font-size:14px;outline:none}
  #msg:focus{border-color:var(--green)}
  #send{background:var(--green);color:#0b2a17;border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer}
  @media (max-width:640px){#target{display:none}.card{width:220px}}
</style>
</head>
<body>
<header>
  <div class="logo">🌿 MY AI <b>OFFICE</b></div>
  <div class="controls">
    <span id="statusBtns"></span>
    <button class="pill" id="listBtn">🤖 에이전트</button>
  </div>
</header>

<main>
  <div class="stage">
    <canvas id="c" width="960" height="576"></canvas>
    <div id="profile" class="card hidden"></div>
    <div id="agentList" class="card hidden"></div>
  </div>
  <p class="hint">방향키 / WASD 이동 · 바닥 클릭 = 그 자리로 걷기 · 캐릭터 클릭 = 프로필 · 에이전트 옆에서 채팅하면 대답해요</p>
  <div id="log"></div>
</main>

<footer>
  <span id="target">대화 상대: 없음</span>
  <input id="msg" placeholder="메시지를 입력하고 Enter (머리 위에 말풍선으로 떠요)" autocomplete="off">
  <button id="send">전송</button>
</footer>

<script>
/* =========================================================
   ✏️ 여기만 고치면 내 에이전트가 바뀌어요 (STEP 4 참고)
   kind: dog / cat / bear / bunny / fox / human
   x, y : 자리 (타일 단위, 아래 '자리 목록' 중에서 고르기)
   ========================================================= */
const MY_NAME = "나";
const AGENTS = [
  { id:"ops",   name:"운영봇",     role:"운영 매니저",    kind:"dog",   color:"#f2c46d", shirt:"#6c8cff", seat:"A",
    intro:"일정 관리, 할 일 정리, 회의록 요약을 맡고 있어요.",
    lines:["오늘 할 일부터 정리해 드릴까요?","일정 꼬인 건 없는지 제가 체크할게요!","회의록은 제가 3줄로 요약해 둘게요."] },
  { id:"res",   name:"리서치봇",   role:"리서처",        kind:"bear",  color:"#b9895a", shirt:"#42b883", seat:"B",
    intro:"시장 조사, 경쟁사 분석, 자료 찾기를 담당해요.",
    lines:["관련 자료 찾아볼게요. 키워드만 주세요!","경쟁사 3곳 비교표 만들어 드릴까요?","출처까지 꼼꼼히 확인해 둘게요."] },
  { id:"copy",  name:"카피라이터", role:"콘텐츠 작가",    kind:"cat",   color:"#ffffff", shirt:"#ff7eb6", seat:"C",
    intro:"인스타 캡션, 블로그 글, 광고 문구를 써요.",
    lines:["후킹 문장 5개 뽑아볼게요!","톤은 귀엽게? 전문적으로?","첫 줄에서 멈추게 만드는 게 제 특기예요."] },
  { id:"design",name:"디자이너",   role:"비주얼 디렉터",  kind:"bunny", color:"#f6d6e4", shirt:"#9b6bff", seat:"D",
    intro:"썸네일, 카드뉴스, 브랜드 컬러를 책임져요.",
    lines:["썸네일 시안 3개 잡아볼게요.","컬러는 핑크+퍼플 어때요?","글자는 줄이고 이미지는 크게!"] },
  { id:"dev",   name:"개발봇",     role:"개발자",        kind:"fox",   color:"#f28c38", shirt:"#2d3561", seat:"E",
    intro:"웹사이트, 자동화, 이 사무실 코드를 관리해요.",
    lines:["버그 잡는 중이에요… 잠시만요!","자동화할 수 있는 건 다 자동화하죠.","배포 버튼은 제가 누를게요 🚀"] },
  { id:"video", name:"영상에디터", role:"영상 편집자",    kind:"human", color:"#ffd9b8", shirt:"#ffb347", seat:"F", hair:"#3a2418",
    intro:"쇼츠, 릴스, 유튜브 편집을 맡고 있어요.",
    lines:["컷 편집은 3초 안에 승부죠.","자막은 크게, 효과음은 적당히!","썸네일이랑 첫 장면 맞춰볼게요."] },
];

/* 자리 목록 (A~L). 에이전트의 seat 에 이 글자를 넣으면 그 자리에 앉아요 */
const SEATS = {
  A:{x:5,   y:3.6, room:"운영실"},   G:{x:8,   y:3.6, room:"운영실"},
  B:{x:15,  y:3.5, room:"HQ"},
  C:{x:22,  y:3.6, room:"크리에이티브"}, D:{x:25,  y:3.6, room:"크리에이티브"},
  E:{x:23,  y:13.6,room:"개발실"},   F:{x:26,  y:13.6,room:"개발실"}, H:{x:23,  y:16.5,room:"개발실"},
  I:{x:7,   y:14.3,room:"라운지"},   J:{x:13.4,y:13.7,room:"회의실"},
  K:{x:16.6,y:13.7,room:"회의실"},   L:{x:26,  y:16.5,room:"개발실"},
};

/* ================= 이 아래는 사무실 엔진 (안 고쳐도 돼요) ================= */
const T = 32, COLS = 30, ROWS = 18;
const cv = document.getElementById("c");
let ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

const STATUS = [["일하는중","#3ddc84"],["회의중","#ffd34d"],["휴식","#ff9f43"],["자리비움","#cfcfe0"]];
let myStatus = 0;

// ---------- 맵 (팔각형 유리벽 오피스 · 하늘그린 테마) ----------
const solid = Array.from({length:ROWS},()=>Array(COLS).fill(false));
const block=(x,y,w=1,h=1)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(solid[j]&&i>=0&&i<COLS)solid[j][i]=true;};
// 바닥 모양: 위 모서리 3칸, 아래 모서리 1칸을 비스듬히 자른 팔각형
const FLOOR=[[4*T,2*T],[26*T,2*T],[29*T,5*T],[29*T,16*T],[28*T,17*T],[2*T,17*T],[T,16*T],[T,5*T]];
const inside=(px,py)=>py>=2*T&&py<=17*T&&px>=T&&px<=29*T&&px+py>=6*T&&px-py<=24*T&&py-px<=15*T&&px+py<=45*T;
for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++)if(!inside(i*T+16,j*T+16))solid[j][i]=true;
// 위쪽 유리 칸막이
for(let y=2;y<=6;y++){block(10,y);block(19,y);}
// 아래쪽 방 벽 (뒷벽 + 옆벽, 문은 비워둠)
for(let i=1;i<=28;i++)if(![7,8,11,12,20,21].includes(i))block(i,10);
for(let y=10;y<=16;y++){block(10,y);block(19,y);}

const ROOMS=[
  {name:"운영실",lx:5.5,ly:7,c:"#4fb7a2"},
  {name:"HQ · 헤드쿼터",lx:16.6,ly:6.75,c:"#ff7eb6"},
  {name:"크리에이티브",lx:25.5,ly:7,c:"#4fb7a2"},
  {name:"라운지",lx:2.6,ly:10.15,c:"#62b8de"},
  {name:"회의실",lx:17,ly:10.15,c:"#62b8de"},
  {name:"개발실 · AX팀",lx:24.5,ly:10.15,c:"#62b8de"},
];
const P={mint:"#7fd9c3",mintD:"#4fb7a2",mintL:"#c4f1e5",sky:"#9fdcf2",skyD:"#5fb3da",skyL:"#d3f0fb",
  wood:"#dcae80",woodD:"#b5875c",woodL:"#efcda6",wall:"#e4f6f0",wallD:"#bfe6da",cream:"#fffaf0"};

const FURN=[], BG=[];
const F=(fn,x,y,w=1,h=1,isSolid=true,...args)=>{FURN.push({fn,x,y,w,h,args});if(isSolid)block(x,y,w,h);};
const RUG=(fn,x,y,w,h,...args)=>BG.push({fn,x,y,w,h,args});
// 운영실
RUG("rugRect",3,4,7,3,"#d3f0fb","#9fdcf2");
F("desk",4,2,2,1);F("desk",7,2,2,1);F("tallplant",3,3);F("plant",6,2,1,1);F("tallplant",9,2);F("cabinet",9,5);F("printer",1,6);F("plant",1,5);
// HQ
RUG("runner",14,4,2,4,"#c4f1e5","#7fd9c3");
F("shelf",11,2,2,1);F("shelf",17,2,2,1);F("tallplant",13,2);F("tallplant",16,2);F("reception",13,4,4,1);F("plant",11,6);F("plant",18,6);
// 크리에이티브
RUG("rugRound",21,4,5,3,"#c4f1e5","#7fd9c3");
F("easel",20,2);F("desk",21,2,2,1);F("desk",24,2,2,1);F("paintTable",20,5,2,1);F("tallplant",28,5);F("beanbag",27,6,1,1,true,"#9fdcf2");F("plant",23,6);
// 복도
F("board",14,7,1,1,false);F("plant",9,8);F("plant",20,8);
// 라운지
RUG("rugRound",3,12,5,4,"#bdeee0","#7fd9c3");
F("counter",2,11,3,1);F("vending",5,11);F("sofaV",1,12,1,3);F("coffeeTable",4,13,2,1);F("sofa",3,15,3,1);F("beanbag",8,13,1,1,true,"#ffb3cc");F("tallplant",9,11);F("lamp",8,15);
// 회의실
RUG("rugRect",12,11,6,6,"#e6ecfb","#c9d6f5");
F("table",14,12,2,4);F("plant",11,11);F("tallplant",18,11);F("plant",11,16);F("plant",18,16);
// 개발실
RUG("rugRect",22,14,6,3,"#d3f0fb","#9fdcf2");
F("desk",22,12,2,1);F("desk",25,12,2,1);F("desk",22,15,2,1);F("desk",25,15,2,1);
F("server",27,11);F("server",28,11);F("cooler",28,14);F("plant",20,16);F("tallplant",20,13);

// ---------- 그리기 도구 ----------
const OUT="#3c4a5c";
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));};
const OR=(x,y,w,h,c)=>{R(x-1,y-1,w+2,h+2,OUT);R(x,y,w,h,c);};
const C=(x,y,r,c,o)=>{if(o){ctx.fillStyle=OUT;ctx.beginPath();ctx.arc(x,y,r+1,0,7);ctx.fill();}ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();};
const SH=(x,y,w)=>{ctx.fillStyle="rgba(30,80,80,.16)";ctx.beginPath();ctx.ellipse(x+w/2,y,w/2+3,5,0,0,7);ctx.fill();};
const now=()=>performance.now();
const SCREENS=["#7fe3f0","#b7f5d6","#c9e6ff","#ffd6e6","#fff1a8"];
const poly=(pts,c)=>{ctx.fillStyle=c;ctx.beginPath();pts.forEach(([a,b],i)=>i?ctx.lineTo(a,b):ctx.moveTo(a,b));ctx.closePath();ctx.fill();};

function monitor(mx,my,k){
  OR(mx-11,my-15,22,15,"#33415a");const s=SCREENS[k%SCREENS.length];R(mx-9,my-13,18,11,s);R(mx-9,my-13,18,3,"rgba(255,255,255,.4)");
  for(let i=0;i<3;i++)R(mx-7,my-9+i*3,4+((k+i)*5)%9,1,"rgba(30,50,70,.5)");
  if(Math.floor(now()/500)%2)R(mx+3,my-3,2,1,"#33415a");
  R(mx-2,my,3,3,"#33415a");R(mx-5,my+2,10,2,"#33415a");
}
function leaf(x,y,rx,ry,rot,c){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=OUT;ctx.beginPath();ctx.ellipse(0,0,rx+1,ry+1,0,0,7);ctx.fill();
  ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,7);ctx.fill();ctx.fillStyle="rgba(255,255,255,.25)";ctx.fillRect(-rx+2,-1,rx*2-4,1);ctx.restore();}
function pot(X,Y,w,h,c){OR(X,Y,w,h,c);R(X,Y,w,3,"rgba(255,255,255,.45)");OR(X-2,Y-3,w+4,4,c);R(X,Y+h-3,w,3,"rgba(0,0,0,.08)");}

const D={
  desk(x,y,w){const X=x*T,Y=y*T,W=w*T,cx=X+W/2;
    SH(X+2,Y+31,W-4);R(X+5,Y+28,3,4,OUT);
    OR(X+2,Y+6,W-4,12,P.mintL);R(X+2,Y+6,W-4,2,"#e6fbf5");
    OR(X+2,Y+18,W-4,11,P.mint);R(X+2,Y+18,W-4,2,"#a6e8d7");
    if(w>=2){OR(X+W-17,Y+18,14,11,P.mintD);R(X+W-12,Y+21,4,1,"#e6fbf5");R(X+W-12,Y+25,4,1,"#e6fbf5");}
    if(w>=2){monitor(cx-12,Y+10,x+y);monitor(cx+12,Y+10,x+y+2);}else monitor(cx,Y+10,x);
    OR(cx-9,Y+12,18,4,"#ffffff");R(cx-8,Y+13,16,1,"#d8e2e8");
    OR(X+6,Y+9,5,6,"#ffffff");R(X+7,Y+10,3,2,"#8a5530");
    OR(X+W-14,Y+9,8,6,"#ffffff");R(X+W-12,Y+11,4,1,"#bbb");},
  chair(px,py){SH(px-9,py+11,18);R(px-1,py+5,2,6,"#5a6478");R(px-7,py+10,14,2,"#5a6478");
    OR(px-8,py-17,16,13,P.mintD);R(px-6,py-15,12,3,"#9fe3d2");OR(px-9,py-4,18,9,P.mint);R(px-9,py-4,18,2,"#b6f0e1");},
  plant(x,y){const X=x*T,Y=y*T;SH(X+6,Y+30,20);
    leaf(X+9,Y+7,8,4,-.8,"#3e9e5a");leaf(X+23,Y+7,8,4,.8,"#3e9e5a");leaf(X+16,Y+1,4,9,0,"#4fb96b");leaf(X+11,Y+12,7,3,-.3,"#5cc977");leaf(X+21,Y+12,7,3,.3,"#5cc977");
    pot(X+9,Y+18,14,11,"#ffffff");R(X+9,Y+23,14,2,P.mint);},
  tallplant(x,y){const X=x*T,Y=y*T;SH(X+5,Y+30,22);R(X+15,Y-16,2,34,"#7a5a3a");
    for(let i=0;i<6;i++){const a=-2.6+i*1.04;leaf(X+16+Math.cos(a)*9,Y-18+Math.sin(a)*5+ (i%2)*3,9,3.5,a,i%2?"#3e9e5a":"#52b86c");}
    leaf(X+9,Y-2,7,3,-.6,"#5cc977");leaf(X+23,Y,7,3,.6,"#5cc977");
    pot(X+8,Y+17,16,12,P.mint);R(X+8,Y+22,16,2,"#ffffff");},
  shelf(x,y,w){const X=x*T,Y=y*T-34,W=w*T;SH(X,Y+66,W);
    OR(X+2,Y,W-4,64,"#c99363");R(X+5,Y+3,W-10,58,"#7a4c30");R(X+2,Y+58,W-4,6,"#b07d50");
    const cs=["#e86a6a","#5aa2e6","#f2c14e","#6cc070","#7fd9c3","#ff8fb3","#ffffff"];
    for(let r=0;r<3;r++){const sy=Y+5+r*18;let bx=X+6,i=r*2+x;
      while(bx<X+W-10){if((i+r)%7===3){C(bx+5,sy+10,4,"#9fdcf2",true);R(bx+4,sy+14,3,2,"#c99363");bx+=11;i++;continue;}
        if((i+r)%9===5){OR(bx+1,sy+9,6,6,P.mint);leaf(bx+4,sy+6,3,4,0,"#52b86c");bx+=9;i++;continue;}
        const h=11+((i*7)%4);R(bx,sy+16-h,5,h,cs[i%cs.length]);R(bx,sy+16-h,5,1,"rgba(255,255,255,.4)");bx+=6;i++;}
      R(X+5,sy+16,W-10,3,"#c99363");}},
  reception(x,y,w){const X=x*T,Y=y*T,W=w*T;SH(X,Y+31,W);
    OR(X,Y+12,W,18,P.mint);R(X,Y+12,W,3,"#a6e8d7");for(let i=8;i<W;i+=16)R(X+i,Y+17,1,12,"rgba(0,0,0,.07)");
    C(X+W/2,Y+21,6,"#fff",true);ctx.fillStyle=P.mintD;ctx.font="bold 7px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("AI",X+W/2,Y+22);ctx.textAlign="left";
    OR(X-2,Y+4,W+4,9,"#ffffff");R(X+10,Y+7,14,1,"#d9eee8");R(X+50,Y+9,20,1,"#d9eee8");
    monitor(X+20,Y+7,4);OR(X+W-20,Y-1,6,7,"#ffffff");C(X+W-17,Y-4,3,"#ff7eb6");C(X+W-14,Y-6,2,"#ffd34d");C(X+W-20,Y-6,2,P.sky);},
  cabinet(x,y){const X=x*T,Y=y*T;SH(X+3,Y+30,26);OR(X+4,Y-8,24,37,"#e6eef2");R(X+24,Y-8,4,37,"#cdd9df");

function ears(c,hx,hy,u,out){
  const col=c.color, inner="#ffb3cc";
  if(c.kind==="cat"||c.kind==="fox"){for(const ox of [0,8]){R(hx+ox*u-1,hy-3*u-1,4*u+2,4*u,out);R(hx+ox*u,hy-3*u,4*u,3*u,col);R(hx+ox*u+u,hy-2*u,2*u,2*u,inner);}}
  else if(c.kind==="bear"){for(const ox of [-1,9]){R(hx+ox*u-1,hy-2*u-1,4*u+2,4*u+2,out);R(hx+ox*u,hy-2*u,4*u,4*u,col);R(hx+ox*u+u,hy-u,2*u,2*u,"#8a5f3c");}}
  else if(c.kind==="bunny"){for(const ox of [2,7]){R(hx+ox*u-1,hy-7*u-1,3*u+2,8*u,out);R(hx+ox*u,hy-7*u,3*u,7*u,col);R(hx+ox*u+u,hy-6*u,u,5*u,inner);}}
  else if(c.kind==="dog"){for(const ox of [-2,11]){R(hx+ox*u-1,hy+u-1,3*u+2,7*u+2,out);R(hx+ox*u,hy+u,3*u,7*u,"#c9954f");}}
}
function nameTag(c){
  const st=STATUS[c.status??0];ctx.font="bold 11px sans-serif";ctx.textBaseline="middle";
  const t=c.name,w=ctx.measureText(t).width+24,x=c.x-w/2,y=c.y-62;
  ctx.fillStyle=c===selected?"#ff7eb6":"rgba(20,45,55,.88)";roundRect(x,y-8,w,16,8);ctx.fill();
  ctx.fillStyle=st[1];ctx.beginPath();ctx.arc(x+9,y,3.5,0,7);ctx.fill();
  ctx.fillStyle="#fff";ctx.fillText(t,x+16,y+1);
}
function bubble(c,t){
  if(!c.say||t>c.sayUntil)return;
  ctx.font="13px sans-serif";const maxW=220, words=[...c.say];let lines=[],cur="";
  for(const ch of words){if(ctx.measureText(cur+ch).width>maxW){lines.push(cur);cur=ch;}else cur+=ch;}lines.push(cur);
  if(lines.length>5){lines=lines.slice(0,5);lines[4]=lines[4].slice(0,-1)+"…";}
  const w=Math.max(...lines.map(l=>ctx.measureText(l).width))+20,h=lines.length*17+12;
  let x=Math.min(Math.max(c.x-w/2,6),cv.width-w-6),y=c.y-74-h;if(y<4)y=4;
  ctx.fillStyle="#fff";roundRect(x,y,w,h,10);ctx.fill();
  ctx.beginPath();ctx.moveTo(c.x-6,y+h);ctx.lineTo(c.x+6,y+h);ctx.lineTo(c.x,y+h+7);ctx.fill();
  ctx.fillStyle="#2b2140";ctx.textBaseline="top";lines.forEach((l,i)=>ctx.fillText(l,x+10,y+7+i*17));
}

// ---------- 캐릭터 만들기 ----------
const agents=AGENTS.map((a,i)=>{const s=SEATS[a.seat]||SEATS.A;return {...a,x:s.x*T,y:s.y*T,room:s.room,status:0,phase:i*1.7,history:[],seatX:s.x*T,seatY:s.y*T};});
const player={name:MY_NAME,kind:"bunny",color:"#ffc2d6",shirt:"#ffffff",x:15*T,y:8.8*T,phase:0,status:0,moving:false,target:null};
let selected=null;
const keys={};

// ---------- 움직임 ----------
function blocked(x,y){
  for(const [dx,dy] of [[-7,-4],[7,-4],[-7,2],[7,2]]){const i=Math.floor((x+dx)/T),j=Math.floor((y+dy)/T);if(!solid[j]||solid[j][i]===undefined||solid[j][i])return true;}
  for(const a of agents)if(Math.hypot(a.x-x,(a.y-y)*0.8)<28)return true;
  return false;
}
function update(dt){
  let vx=0,vy=0;const sp=150*dt;
  if(keys.ArrowLeft||keys.a)vx-=1;if(keys.ArrowRight||keys.d)vx+=1;if(keys.ArrowUp||keys.w)vy-=1;if(keys.ArrowDown||keys.s)vy+=1;
  if(vx||vy)player.target=null;
  if(player.target){const dx=player.target.x-player.x,dy=player.target.y-player.y,d=Math.hypot(dx,dy);if(d<3)player.target=null;else{vx=dx/d;vy=dy/d;}}
  if(vx&&vy&&!player.target){vx*=.707;vy*=.707;}
  let moved=false;
  if(vx&&!blocked(player.x+vx*sp,player.y)){player.x+=vx*sp;moved=true;}
  if(vy&&!blocked(player.x,player.y+vy*sp)){player.y+=vy*sp;moved=true;}
  if(player.target&&!moved)player.target=null;
  player.moving=moved;
  updateTarget();
}
function nearest(){let best=null,bd=96;for(const a of agents){const d=Math.hypot(a.x-player.x,a.y-player.y);if(d<bd){bd=d;best=a;}}return best;}
function talkTarget(){return nearest()||selected;}
let lastTargetName="";
function updateTarget(){const t=talkTarget(),n=t?t.name:"없음";if(n!==lastTargetName){lastTargetName=n;document.getElementById("target").textContent="대화 상대: "+n;}}

// ---------- 루프 ----------
let last=performance.now();
function loop(t){
  const dt=Math.min((t-last)/1000,.05);last=t;update(dt);
  drawMap();
  for(const a of agents)D.chair(a.seatX,a.seatY-2);
  const items=[...FURN.map(f=>({y:(f.y+f.h)*T,draw:()=>D[f.fn](f.x,f.y,f.w,f.h,...f.args)})),
               ...[...agents,player].map(c=>({y:c.y,draw:()=>drawChar(c,t)}))];
  items.sort((a,b)=>a.y-b.y).forEach(i=>i.draw());
  ctx.drawImage(vig,0,0);
  drawRoomLabels();
  for(const c of [...agents,player])nameTag(c);
  for(const c of [...agents,player])bubble(c,t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- 입력 ----------
const inputEl=document.getElementById("msg");
addEventListener("keydown",e=>{if(document.activeElement===inputEl)return;const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;if(k.startsWith("Arrow"))e.preventDefault();if(e.key==="Enter")inputEl.focus();});
addEventListener("keyup",e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false;});
addEventListener("blur",()=>{for(const k in keys)keys[k]=false;});

cv.addEventListener("click",e=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*cv.width/r.width,y=(e.clientY-r.top)*cv.height/r.height;
  const hit=[...agents].reverse().find(a=>x>a.x-14&&x<a.x+14&&y>a.y-50&&y<a.y+4);
  if(hit){openProfile(hit);return;}
  closeCards();player.target={x,y};
});

const prof=document.getElementById("profile"),list=document.getElementById("agentList");
function closeCards(){prof.classList.add("hidden");list.classList.add("hidden");}
function openProfile(a){
  selected=a;list.classList.add("hidden");
  const st=STATUS[a.status];
  prof.innerHTML=`<h3>${a.name}</h3><div class="role">${a.role} · ${a.room}</div>
    <p><span style="color:${st[1]}">●</span> ${st[0]}</p><p>${a.intro}</p>
    <button class="pill" id="goTalk">💬 대화하기</button><button class="pill" id="closeP">닫기</button>`;
  const r=cv.getBoundingClientRect(),sx=r.width/cv.width;
  let left=a.x*sx+20, top=Math.max(a.y*sx-120,8);
  if(left+270>r.width)left=a.x*sx-280;
  prof.style.left=Math.max(left,8)+"px";prof.style.top=top+"px";prof.classList.remove("hidden");
  document.getElementById("goTalk").onclick=()=>{player.target={x:a.x,y:a.y+30};closeCards();inputEl.focus();};
  document.getElementById("closeP").onclick=()=>{selected=null;closeCards();};
}
document.getElementById("listBtn").onclick=()=>{
  prof.classList.add("hidden");
  list.innerHTML="<h3>에이전트 목록</h3>"+agents.map((a,i)=>`<div class="row" data-i="${i}"><span>${a.name}</span><span style="color:#a99fd6;font-size:12px">${a.role}</span></div>`).join("");
  list.classList.toggle("hidden");
  list.querySelectorAll(".row").forEach(r=>r.onclick=()=>openProfile(agents[r.dataset.i]));
};
const sb=document.getElementById("statusBtns");
function renderStatus(){sb.innerHTML=STATUS.map((s,i)=>`<button class="pill ${i===myStatus?"on":""}" data-i="${i}"><span class="dot" style="background:${s[1]}"></span>${s[0]}</button>`).join(" ");
  sb.querySelectorAll("button").forEach(b=>b.onclick=()=>{myStatus=+b.dataset.i;player.status=myStatus;renderStatus();});}
renderStatus();

// ---------- 채팅 ----------
const logEl=document.getElementById("log");
function log(who,text){const d=document.createElement("div");d.innerHTML=`<span class="who">${who}</span> ${text.replace(/</g,"&lt;")}`;logEl.appendChild(d);logEl.scrollTop=1e9;}
function say(c,text,ms=7000){c.say=text;c.sayUntil=performance.now()+ms;}

async function ask(a,text){
  a.history.push({role:"user",content:text});a.history=a.history.slice(-10);
  const system=`너는 '${a.name}'라는 AI 에이전트야. 역할: ${a.role}. ${a.intro} 픽셀아트 가상 사무실의 ${a.room}에서 일하고 있고, 사장님(${MY_NAME})과 대화 중이야. 한국어로 2~3문장, 친근하고 짧게 답해.`;
  try{
    if(location.protocol==="file:")throw 0;
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system,messages:a.history})});
    const j=await r.json();if(!j.reply)throw 0;
    a.history.push({role:"assistant",content:j.reply});return j.reply;
  }catch(_){
    a.history.pop();
    const line=a.lines[Math.floor(Math.random()*a.lines.length)];
    return `${line} (데모 답변 · AI 연결 전)`;
  }
}
async function send(){
  const text=inputEl.value.trim();if(!text)return;inputEl.value="";
  say(player,text);log(MY_NAME,text);
  const a=talkTarget();
  if(!a){setTimeout(()=>log("💡","에이전트 옆으로 가거나 캐릭터를 클릭하면 대답해요."),300);return;}
  a.status=0;say(a,"…",30000);
  const reply=await ask(a,text);say(a,reply,9000);log(a.name,reply);
  inputEl.blur();
}
document.getElementById("send").onclick=send;
inputEl.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();send();}if(e.key==="Escape")inputEl.blur();});

// 가끔 상태가 바뀌어서 살아있는 느낌
setInterval(()=>{const a=agents[Math.floor(Math.random()*agents.length)];a.status=Math.random()<.7?0:Math.floor(Math.random()*3);},6000);
setTimeout(()=>{say(agents[0],"사장님 오셨어요! 저한테 와서 말 걸어주세요 👋",6000);},800);
</script>
